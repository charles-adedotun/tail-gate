[package]
name = "tail-gate"
version = "0.1.0"
edition = "2021"
authors = ["Charles Adedotun <charles.adedotun8@gmail.com>"]
license = "MIT"
description = "RFC 9110 HTTP 421 fail-closed edge ingress proxy and Unix Domain Socket zero-trust gateway for Tailscale meshes in Safe Rust."
repository = "https://github.com/charles-adedotun/tail-gate"
readme = "README.md"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "server-auto"] }
http-body-util = "0.1"
bytes = "1.7"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
